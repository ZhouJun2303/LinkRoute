name: Bug report
description: Report a reproducible LinkRoute bug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10 22H2
        - Other
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network setup
      description: Ethernet/Wi-Fi adapters, VPN state, firewall, and whether WinDivert files are present.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      render: text
